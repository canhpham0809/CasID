<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dữ liệu (Mới khởi tạo) - Casso ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body,
        input,
        select,
        textarea,
        button,
        span,
        p,
        div,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        strong,
        label,
        input::placeholder,
        textarea::placeholder {
            font-family: 'Roboto', sans-serif !important;
        }

        /* Giả lập khung viền điện thoại */
        .phone-container {
            width: 375px;
            height: 812px;
        }

        /* Ẩn thanh cuộn cho thẻ đối tượng */
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <div
        class="phone-container bg-white shadow-2xl rounded-[40px] overflow-hidden flex flex-col relative border-[8px] border-black">

        <!-- Status Bar -->
        <div class="flex justify-between items-center px-6 pt-3 pb-2 text-xs font-bold text-black bg-white z-10">
            <span>15:34</span>
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <span class="text-[9px] font-bold mr-0.5">5G</span>
                <i class="fa-solid fa-battery-three-quarters text-sm"></i>
            </div>
        </div>

        <!-- Scrollable content area -->
        <div class="flex-1 overflow-y-auto px-6 pt-4 pb-20 bg-white relative">

            <!-- CAS Logo header -->
            <div class="mb-5 flex items-center justify-start">
                <span class="text-3xl font-black text-black tracking-tighter"
                    style="font-family: 'Outfit', 'Inter', sans-serif;">CAS</span>
            </div>

            <!-- Entity Cards Container: only personal at first — a business pill only appears once verified -->
            <div class="flex gap-2 overflow-x-auto pb-2 mb-8 w-full scrollbar-none"
                style="scrollbar-width: none; -ms-overflow-style: none;">
                <!-- Verified business pills render here, ahead of personal, as they get added -->
                <div id="dynamic-biz-pills-container" class="flex gap-2 shrink-0"></div>

                <!-- Personal Profile -->
                <div id="entity-personal" onclick="switchEntity('personal')"
                    class="flex items-center gap-2 bg-black text-white px-3 py-1.5 rounded-full shrink-0 shadow-sm cursor-pointer border border-black transition-all">
                    <div
                        class="w-5 h-5 rounded-full bg-white text-black text-[9px] font-black flex items-center justify-center shrink-0">
                        NA
                    </div>
                    <span class="text-[9px] font-bold tracking-wider leading-none">NGUYỄN VĂN AN</span>
                </div>
            </div>

            <!-- List Options Cards -->
            <div class="flex flex-col gap-4">

                <!-- Option 1: Ngân hàng -->
                <div onclick="navigateToAsset('bank')"
                    class="bg-white rounded-2xl p-4 shadow-[0_4px_16px_rgba(0,0,0,0.03)] border border-gray-100 flex items-center justify-between hover:bg-gray-50 active:scale-[0.99] transition-all cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-12 h-12 rounded-full bg-[#181818] flex items-center justify-center text-white text-lg shrink-0">
                            <i class="fa-solid fa-building-columns"></i>
                        </div>
                        <span class="text-sm font-bold text-gray-800">Ngân hàng</span>
                    </div>
                    <span id="asset-count-bank" class="text-[11px] font-bold text-gray-400"></span>
                </div>

                <!-- Option 2: Hóa đơn điện tử -->
                <div onclick="navigateToAsset('invoice')"
                    class="bg-white rounded-2xl p-4 shadow-[0_4px_16px_rgba(0,0,0,0.03)] border border-gray-100 flex items-center justify-between hover:bg-gray-50 active:scale-[0.99] transition-all cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-12 h-12 rounded-full bg-[#181818] flex items-center justify-center text-white text-lg shrink-0">
                            <i class="fa-solid fa-file-invoice-dollar"></i>
                        </div>
                        <span class="text-sm font-bold text-gray-800">Hóa đơn điện tử</span>
                    </div>
                    <span id="asset-count-invoice" class="text-[11px] font-bold text-gray-400"></span>
                </div>

                <!-- Option 3: Chứng thư số -->
                <div onclick="navigateToAsset('ca')"
                    class="bg-white rounded-2xl p-4 shadow-[0_4px_16px_rgba(0,0,0,0.03)] border border-gray-100 flex items-center justify-between hover:bg-gray-50 active:scale-[0.99] transition-all cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-12 h-12 rounded-full bg-[#181818] flex items-center justify-center text-white text-lg shrink-0">
                            <i class="fa-solid fa-signature"></i>
                        </div>
                        <span class="text-sm font-bold text-gray-800">Chứng thư số</span>
                    </div>
                    <span id="asset-count-ca" class="text-[11px] font-bold text-gray-400"></span>
                </div>

                <!-- Option 4: Yêu cầu ký số -->
                <div id="card-sign-request" onclick="window.location.href='casID-sign-request.html'"
                    class="bg-white rounded-2xl p-4 shadow-[0_4px_16px_rgba(0,0,0,0.03)] border border-gray-100 flex items-center justify-between hover:bg-gray-50 active:scale-[0.99] transition-all cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-12 h-12 rounded-full bg-[#181818] flex items-center justify-center text-white text-lg shrink-0">
                            <i class="fa-solid fa-file-contract"></i>
                        </div>
                        <span class="text-sm font-bold text-gray-800">Yêu cầu ký số</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="sign-request-count-badge"
                            class="hidden w-5 h-5 min-w-[20px] rounded-full bg-red-500 text-white text-[11px] font-black flex items-center justify-center shadow-xs">0</span>
                    </div>
                </div>
                <!-- Option 5: Ủy quyền -->
                <div id="card-delegation" onclick="window.location.href='casID-sign-delegation.html'"
                    class="bg-white rounded-2xl p-4 shadow-[0_4px_16px_rgba(0,0,0,0.03)] border border-gray-100 flex items-center justify-between hover:bg-gray-50 active:scale-[0.99] transition-all cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-12 h-12 rounded-full bg-[#181818] flex items-center justify-center text-white text-lg shrink-0">
                            <i class="fa-solid fa-qrcode"></i>
                        </div>
                        <span class="text-sm font-bold text-gray-800">Ủy quyền</span>
                    </div>
                </div>

            </div>

        </div>

        <!-- Floating Action Button (FAB) -->
        <button onclick="showComingSoon()"
            class="absolute bottom-20 right-6 w-12 h-12 bg-black hover:bg-gray-900 text-white rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-all z-10">
            <i class="fa-solid fa-plus text-lg"></i>
        </button>

        <!-- Bottom Navigation Bar (active tab: Dữ liệu) -->
        <div
            class="bg-white border-t border-gray-100 px-2 py-2 flex justify-around items-center text-[10px] text-gray-400 font-medium pb-5 z-10">
            <button onclick="window.location.href=demoHomeUrl()"
                class="flex flex-col items-center gap-1 w-16 text-gray-400 hover:text-gray-700">
                <i class="fa-solid fa-house text-lg"></i>
                <span>Trang chủ</span>
            </button>
            <button onclick="window.location.href='casID-business-list.html'"
                class="flex flex-col items-center gap-1 w-16 text-gray-400 hover:text-gray-700 relative">
                <div class="relative">
                    <i class="fa-solid fa-building text-lg"></i>
                    <span id="nav-business-badge"
                        class="absolute -top-1.5 -right-2 min-w-[15px] h-[15px] px-1 bg-red-500 text-white text-[9px] font-black rounded-full flex items-center justify-center border-2 border-white shadow-xs hidden">0</span>
                </div>
                <span>Doanh nghiệp</span>
            </button>
            <button onclick="window.location.href='casID-sign-delegation.html'"
                class="flex flex-col items-center gap-1 w-16 text-gray-400 hover:text-gray-700">
                <i class="fa-solid fa-qrcode text-lg"></i>
                <span>Ủy quyền</span>
            </button>
            <button onclick="window.location.href='casID-sign-noti-empty.html'"
                class="flex flex-col items-center gap-1 w-16 text-gray-400 hover:text-gray-700 relative">
                <div class="relative">
                    <i class="fa-solid fa-bell text-lg"></i>
                </div>
                <span>Thông báo</span>
            </button>
            <button onclick="showToast('Tính năng Hồ sơ đang phát triển')"
                class="flex flex-col items-center gap-1 w-16 text-gray-400 hover:text-gray-700">
                <i class="fa-solid fa-circle-user text-lg"></i>
                <span class="font-bold">Hồ sơ</span>
            </button>
        </div>

        <!-- Custom Toast alert banner -->
        <div id="custom-toast"
            class="absolute top-12 left-4 right-4 z-50 bg-gray-900/95 backdrop-blur-md text-white rounded-2xl p-3.5 shadow-xl flex items-center gap-2.5 transform -translate-y-6 opacity-0 transition-all duration-300 pointer-events-none hidden border border-gray-800">
            <i id="custom-toast-icon" class="text-xs shrink-0 text-amber-400 fa-solid fa-circle-info"></i>
            <span id="custom-toast-msg" class="text-[11px] font-semibold leading-snug"></span>
        </div>

    </div>

    <!-- Demo Scenario Control (web page tool — lives outside the phone mockup, not part of the product UI) -->
    <div class="fixed top-4 right-4 z-50 flex items-start gap-2">
        <div class="relative">
            <button onclick="toggleDemoPanel()"
                class="w-10 h-10 rounded-full bg-gray-900 text-white flex items-center justify-center shadow-lg hover:bg-gray-800 active:scale-95 transition-all">
                <i class="fa-solid fa-sliders text-[13px]"></i>
            </button>
            <div id="demo-panel"
                class="hidden absolute top-12 right-0 w-56 bg-white rounded-xl shadow-xl border border-gray-100 p-2 flex flex-col gap-1">
                <span class="text-[9px] font-bold text-gray-400 uppercase tracking-wider px-1.5 pt-0.5">Kịch bản
                    demo</span>
                <button id="demo-btn-full" onclick="setDemoScenario('full')"
                    class="text-left px-2.5 py-2 rounded-lg text-[11px] font-bold flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-circle-check text-[10px]"></i>
                    <span>Hồ sơ đầy đủ</span>
                </button>
                <button id="demo-btn-new" onclick="setDemoScenario('new')"
                    class="text-left px-2.5 py-2 rounded-lg text-[11px] font-bold flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-seedling text-[10px]"></i>
                    <span>Hồ sơ mới khởi tạo</span>
                </button>
                <div class="border-t border-gray-100 my-0.5"></div>
                <button onclick="resetDemoScenario()"
                    class="text-left px-2.5 py-2 rounded-lg text-[10.5px] font-semibold text-red-500 hover:bg-red-50 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-rotate-left text-[10px]"></i>
                    <span>Reset kịch bản hiện tại</span>
                </button>
            </div>
        </div>

        <!-- Demo MST reference note -->
        <div class="bg-white rounded-xl shadow-lg border border-gray-100 p-3 w-44">
            <div class="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">MST demo</div>
            <div class="flex flex-col gap-1 text-[11px] font-mono font-bold text-gray-700">
                <span>0316829871</span>
                <span>0318999888</span>
                <span>0317654321</span>
                <span>0319556677</span>
                <span>0304567890</span>
            </div>
        </div>
    </div>

    <script>
        // =========================================================
        // DEMO SCENARIO CONTROL (presenter tool)
        // =========================================================
        function getDemoScenario() {
            return localStorage.getItem('casso_demo_scenario') || 'new';
        }

        function demoHomeUrl() {
            return getDemoScenario() === 'new' ? 'index-empty.html' : 'index.html';
        }

        function toggleDemoPanel() {
            document.getElementById('demo-panel')?.classList.toggle('hidden');
        }

        function renderDemoPanel() {
            const scenario = getDemoScenario();
            const activeCls = "text-left px-2.5 py-2 rounded-lg text-[11px] font-bold flex items-center gap-2 transition-all bg-gray-900 text-white";
            const idleCls = "text-left px-2.5 py-2 rounded-lg text-[11px] font-bold flex items-center gap-2 transition-all text-gray-700 hover:bg-gray-50";
            const fullBtn = document.getElementById('demo-btn-full');
            const newBtn = document.getElementById('demo-btn-new');
            if (fullBtn) fullBtn.className = scenario === 'full' ? activeCls : idleCls;
            if (newBtn) newBtn.className = scenario === 'new' ? activeCls : idleCls;
        }

        function clearDemoDatasets() {
            localStorage.removeItem('casso_user_businesses_v7');
            localStorage.removeItem('casso_discovered_businesses_v2');
            localStorage.removeItem('casso_active_entity');
            Object.keys(localStorage).filter(k => k.startsWith('casso_assets_')).forEach(k => localStorage.removeItem(k));
        }

        function setDemoScenario(scenario) {
            localStorage.setItem('casso_demo_scenario', scenario);
            clearDemoDatasets();
            window.location.href = scenario === 'new' ? 'index-empty.html' : 'index.html';
        }

        function resetDemoScenario() {
            clearDemoDatasets();
            window.location.reload();
        }

        let activeEntity = localStorage.getItem('casso_active_entity') || 'personal';

        window.onload = function () {
            // Landing on this screen at all IS the "new" scenario — keep the flag in sync so
            // casID-asset-list.html / casID-business-list.html seed empty data, not the full demo set.
            localStorage.setItem('casso_demo_scenario', 'new');
            updateFooterNotiBadge();
            updateSignRequestBadge();
            updateEntityUI();
            renderDynamicBizPills();
            renderAssetCounts();
            renderDemoPanel();
        };

        // =========================================================
        // ENTITY PILLS: only personal by default — a pill is added here
        // the moment a business finishes verification (casso_user_businesses_v7)
        // =========================================================
        function getVerifiedBusinessesForPills() {
            try {
                const list = JSON.parse(localStorage.getItem('casso_user_businesses_v7') || '[]');
                return list.filter(b => b.status === 'verified');
            } catch (e) {
                return [];
            }
        }

        function businessShortLabel(biz) {
            if (biz.shortName) return biz.shortName;
            const prefixes = ['CÔNG TY CỔ PHẦN', 'CÔNG TY TNHH MỘT THÀNH VIÊN', 'CÔNG TY TNHH', 'CÔNG TY HỢP DANH', 'DOANH NGHIỆP TƯ NHÂN'];
            let clean = (biz.name || '').trim();
            const upper = clean.toUpperCase();
            const prefix = prefixes.find(p => upper.startsWith(p));
            if (prefix) clean = clean.slice(prefix.length).trim();
            return (clean.split(/\s+/)[0] || 'DN').toUpperCase().slice(0, 12);
        }

        function renderDynamicBizPills() {
            const container = document.getElementById('dynamic-biz-pills-container');
            if (!container) return;
            const businesses = getVerifiedBusinessesForPills();
            container.innerHTML = businesses.map(biz => {
                const label = businessShortLabel(biz);
                const active = activeEntity === biz.id;
                const pillCls = active
                    ? "flex items-center gap-2 bg-purple-900 text-white px-3 py-1.5 rounded-full shrink-0 shadow-sm cursor-pointer border border-purple-900 transition-all"
                    : "flex items-center gap-2 bg-white text-gray-500 border border-gray-200 px-3 py-1.5 rounded-full shrink-0 shadow-sm cursor-pointer hover:bg-gray-50 transition-all";
                return `
                    <div id="entity-${biz.id}" onclick="switchEntity('${biz.id}')" class="${pillCls}">
                        <div class="w-5 h-5 rounded-full bg-purple-100 text-purple-800 text-[9px] font-black flex items-center justify-center shrink-0">
                            ${label.slice(0, 2).toUpperCase()}
                        </div>
                        <span class="text-[9px] font-bold tracking-wider leading-none max-w-[90px] truncate">${label}</span>
                    </div>
                `;
            }).join('');

            // If the entity currently active got removed/unlinked elsewhere, fall back to personal
            if (activeEntity !== 'personal' && !businesses.find(b => b.id === activeEntity)) {
                switchEntity('personal');
            }
        }

        function switchEntity(entityId) {
            activeEntity = entityId;
            localStorage.setItem('casso_active_entity', entityId);
            updateEntityUI();
            renderDynamicBizPills();
            renderAssetCounts();
        }

        function updateEntityUI() {
            const personalActive = activeEntity === 'personal';
            const el = document.getElementById('entity-personal');
            if (!el) return;
            const avatar = el.querySelector('div');
            const text = el.querySelector('span');
            if (personalActive) {
                el.className = "flex items-center gap-2 bg-black text-white px-3 py-1.5 rounded-full shrink-0 shadow-sm cursor-pointer border border-black transition-all";
                if (avatar) avatar.className = "w-5 h-5 rounded-full bg-white text-black text-[9px] font-black flex items-center justify-center shrink-0";
            } else {
                el.className = "flex items-center gap-2 bg-white text-gray-500 border border-gray-200 px-3 py-1.5 rounded-full shrink-0 shadow-sm cursor-pointer hover:bg-gray-50 transition-all";
                if (avatar) avatar.className = "w-5 h-5 rounded-full bg-gray-100 text-gray-700 text-[9px] font-black flex items-center justify-center shrink-0";
            }
        }

        // =========================================================
        // ASSET ROWS: Ngân hàng / Hóa đơn điện tử / Chứng thư số route to
        // the shared asset-list screen, scoped to whichever entity is active
        // =========================================================
        function navigateToAsset(type) {
            localStorage.setItem('casso_active_entity', activeEntity);
            window.location.href = 'casID-asset-list.html?type=' + type;
        }

        function renderAssetCounts() {
            ['bank', 'invoice', 'ca'].forEach(type => {
                const el = document.getElementById('asset-count-' + type);
                if (!el) return;
                let count = 0;
                try {
                    const stored = localStorage.getItem('casso_assets_' + type + '__' + activeEntity);
                    if (stored) count = JSON.parse(stored).length;
                } catch (e) { }
                el.textContent = count > 0 ? `${count} đã kết nối` : '';
            });
        }

        function updateSignRequestBadge() {
            const signedStatus = localStorage.getItem('doc_signed_status');
            const count = signedStatus ? 1 : 0; // Fresh account starts with no pending sign requests
            const badge = document.getElementById('sign-request-count-badge');
            if (badge) {
                badge.textContent = count;
                badge.classList.toggle('hidden', count === 0);
            }
        }

        // No generic notifications badge in this scenario — the only thing worth flagging
        // from here is businesses still waiting to be confirmed from a CCCD match.
        function updateFooterNotiBadge() {
            const badge = document.getElementById('nav-business-badge');
            if (!badge) return;
            let discoveredCount = 0;
            try {
                const stored = localStorage.getItem('casso_discovered_businesses_v2');
                if (stored) discoveredCount = JSON.parse(stored).length;
            } catch (e) { }
            badge.textContent = String(discoveredCount);
            badge.classList.toggle('hidden', discoveredCount === 0);
        }

        function showComingSoon() {
            showToast('Tính năng đang được phát triển');
        }

        let toastTimeout = null;
        function showToast(msg, iconClass = "fa-solid fa-circle-info text-amber-400") {
            const toast = document.getElementById('custom-toast');
            const toastMsg = document.getElementById('custom-toast-msg');
            const toastIcon = document.getElementById('custom-toast-icon');

            if (toast && toastMsg) {
                toastMsg.textContent = msg;
                if (toastIcon) toastIcon.className = iconClass;

                toast.classList.remove('hidden');
                toast.offsetHeight; // force reflow
                toast.classList.remove('-translate-y-6', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');

                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('-translate-y-6', 'opacity-0');
                    setTimeout(() => toast.classList.add('hidden'), 300);
                }, 3000);
            }
        }
    </script>
</body>

</html>
