<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dữ liệu - Casso ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, input, select, textarea, button, span, p, div, h1, h2, h3, h4, h5, h6, strong, label, input::placeholder, textarea::placeholder {
            font-family: 'Roboto', sans-serif !important;
        }

        /* Giả lập khung viền điện thoại */
        .phone-container {
            width: 375px;
            height: 812px;
        }

        /* Ẩn thanh cuộn cho thẻ đối tượng */
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <div
        class="phone-container bg-white shadow-2xl rounded-[40px] overflow-hidden flex flex-col relative border-[8px] border-black">

        <!-- Status Bar -->
        <div class="flex justify-between items-center px-6 pt-3 pb-2 text-xs font-bold text-black bg-white z-10">
            <span>15:34</span>
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <span class="text-[9px] font-bold mr-0.5">5G</span>
                <i class="fa-solid fa-battery-three-quarters text-sm"></i>
            </div>
        </div>

        <!-- Scrollable content area -->
        <div class="flex-1 overflow-y-auto px-6 pt-4 pb-20 bg-white relative">

            <!-- CAS Logo header -->
            <div class="mb-5 flex items-center justify-start">
                <span class="text-3xl font-black text-black tracking-tighter"
                    style="font-family: 'Outfit', 'Inter', sans-serif;">CAS</span>
            </div>

            <!-- Entity Cards Container -->
            <div class="flex gap-2 overflow-x-auto pb-2 mb-8 w-full scrollbar-none" style="scrollbar-width: none; -ms-overflow-style: none;">
                <!-- Personal Profile -->
                <div id="entity-personal" onclick="switchEntity('personal')"
                    class="flex items-center gap-2 bg-black text-white px-3 py-1.5 rounded-full shrink-0 shadow-sm cursor-pointer border border-black transition-all">
                    <div class="w-5 h-5 rounded-full bg-white text-black text-[9px] font-black flex items-center justify-center shrink-0">
                        PC
                    </div>
                    <span class="text-[9px] font-bold tracking-wider leading-none">PHAM HOANG QUANG CANH</span>
                </div>

                <!-- Enterprise 1 (Casso) -->
                <div id="entity-casso" onclick="switchEntity('casso')"
                    class="flex items-center gap-2 bg-white text-gray-500 border border-gray-200 px-3 py-1.5 rounded-full shrink-0 shadow-sm cursor-pointer hover:bg-gray-50 transition-all">
                    <div class="w-5 h-5 rounded-full bg-gray-100 text-gray-700 text-[9px] font-black flex items-center justify-center shrink-0">
                        CS
                    </div>
                    <span class="text-[9px] font-bold tracking-wider leading-none">CÔNG TY TNHH CASSO</span>
                </div>

                <!-- Enterprise 2 (A4B) -->
                <div id="entity-a4b" onclick="switchEntity('a4b')"
                    class="flex items-center gap-2 bg-white text-gray-500 border border-gray-200 px-3 py-1.5 rounded-full shrink-0 shadow-sm cursor-pointer hover:bg-gray-50 transition-all">
                    <div class="w-5 h-5 rounded-full bg-gray-100 text-gray-700 text-[9px] font-black flex items-center justify-center shrink-0">
                        AB
                    </div>
                    <span class="text-[9px] font-bold tracking-wider leading-none">CÔNG TY CỔ PHẦN A4B</span>
                </div>

                <!-- Ủy quyền số -->
                <div id="entity-delegated" onclick="switchEntity('delegated')"
                    class="flex items-center gap-2 bg-white text-gray-500 border border-gray-200 px-3 py-1.5 rounded-full shrink-0 shadow-sm cursor-pointer hover:bg-gray-50 transition-all">
                    <div class="w-5 h-5 rounded-full bg-gray-100 text-gray-700 text-[9px] font-black flex items-center justify-center shrink-0">
                        UQ
                    </div>
                    <span class="text-[9px] font-bold tracking-wider leading-none">Ủy quyền số</span>
                </div>
            </div>

            <!-- List Options Cards -->
            <div class="flex flex-col gap-4">

                <!-- Option 1: Ngân hàng -->
                <div onclick="showComingSoon()"
                    class="bg-white rounded-2xl p-4 shadow-[0_4px_16px_rgba(0,0,0,0.03)] border border-gray-100 flex items-center gap-4 hover:bg-gray-50 active:scale-[0.99] transition-all cursor-pointer">
                    <div
                        class="w-12 h-12 rounded-full bg-[#181818] flex items-center justify-center text-white text-lg shrink-0">
                        <i class="fa-solid fa-building-columns"></i>
                    </div>
                    <span class="text-sm font-bold text-gray-800">Ngân hàng</span>
                </div>

                <!-- Option 2: Hóa đơn điện tử -->
                <div onclick="showComingSoon()"
                    class="bg-white rounded-2xl p-4 shadow-[0_4px_16px_rgba(0,0,0,0.03)] border border-gray-100 flex items-center gap-4 hover:bg-gray-50 active:scale-[0.99] transition-all cursor-pointer">
                    <div
                        class="w-12 h-12 rounded-full bg-[#181818] flex items-center justify-center text-white text-lg shrink-0">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                    </div>
                    <span class="text-sm font-bold text-gray-800">Hóa đơn điện tử</span>
                </div>

                <!-- Option 3: Chứng thư số -->
                <div onclick="navigateToCa()"
                    class="bg-white rounded-2xl p-4 shadow-[0_4px_16px_rgba(0,0,0,0.03)] border border-gray-100 flex items-center gap-4 hover:bg-gray-50 active:scale-[0.99] transition-all cursor-pointer">
                    <div
                        class="w-12 h-12 rounded-full bg-[#181818] flex items-center justify-center text-white text-lg shrink-0">
                        <i class="fa-solid fa-signature"></i>
                    </div>
                    <span class="text-sm font-bold text-gray-800">Chứng thư số</span>
                </div>

                <!-- Option 4: Yêu cầu ký số -->
                <div id="card-sign-request" onclick="navigateToSignRequest()"
                    class="bg-white rounded-2xl p-4 shadow-[0_4px_16px_rgba(0,0,0,0.03)] border border-gray-100 flex items-center gap-4 hover:bg-gray-50 active:scale-[0.99] transition-all cursor-pointer">
                    <div
                        class="w-12 h-12 rounded-full bg-[#181818] flex items-center justify-center text-white text-lg shrink-0">
                        <i class="fa-solid fa-file-contract"></i>
                    </div>
                    <span class="text-sm font-bold text-gray-800">Yêu cầu ký số</span>
                </div>

            </div>

        </div>

        <!-- Floating Action Button (FAB) -->
        <button onclick="showComingSoon()"
            class="absolute bottom-20 right-6 w-12 h-12 bg-black hover:bg-gray-900 text-white rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-all z-10">
            <i class="fa-solid fa-plus text-lg"></i>
        </button>

        <!-- Bottom Navigation Bar (active tab: Dữ liệu) -->
        <div
            class="bg-white border-t border-gray-100 px-2 py-2 flex justify-around items-center text-[10px] text-gray-400 font-medium pb-5 z-10">
            <button onclick="showComingSoon()" class="flex flex-col items-center gap-1 w-16 text-gray-400">
                <i class="fa-solid fa-house text-lg"></i>
                <span>Trang chủ</span>
            </button>
            <button class="flex flex-col items-center gap-1 w-16 text-black">
                <i class="fa-solid fa-server text-lg"></i>
                <span class="font-bold">Dữ liệu</span>
            </button>
            <button onclick="window.location.href='casID-sign-delegation.html'" class="flex flex-col items-center gap-1 w-16 text-gray-400">
                <i class="fa-solid fa-qrcode text-lg"></i>
                <span>Cấp quyền</span>
            </button>
            <button onclick="window.location.href='casID-sign-noti.html'" class="flex flex-col items-center gap-1 w-16 text-gray-400 relative">
                <div class="relative">
                    <i class="fa-solid fa-bell text-lg"></i>
                    <span id="footer-noti-badge" class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 text-white text-[8px] font-bold rounded-full flex items-center justify-center border border-white hidden">
                        2
                    </span>
                </div>
                <span>Thông báo</span>
            </button>
            <button onclick="showComingSoon()" class="flex flex-col items-center gap-1 w-16 text-gray-400">
                <i class="fa-solid fa-circle-user text-lg"></i>
                <span class="font-bold">Hồ sơ</span>
            </button>
        </div>

        <!-- Custom Toast alert banner -->
        <div id="custom-toast"
            class="absolute top-12 left-4 right-4 z-50 bg-gray-900/95 backdrop-blur-md text-white rounded-2xl p-3.5 shadow-xl flex items-center gap-2.5 transform -translate-y-6 opacity-0 transition-all duration-300 pointer-events-none hidden border border-gray-800">
            <i id="custom-toast-icon" class="text-xs shrink-0 text-amber-400 fa-solid fa-circle-info"></i>
            <span id="custom-toast-msg" class="text-[11px] font-semibold leading-snug"></span>
        </div>

    </div>

    <script>
        let activeEntity = localStorage.getItem('active_entity') || 'personal';

        window.onload = function() {
            updateFooterNotiBadge();
            updateEntityUI();
        };

        function switchEntity(entityId) {
            activeEntity = entityId;
            localStorage.setItem('active_entity', entityId);
            updateEntityUI();
        }

        function updateEntityUI() {
            const entities = ['personal', 'casso', 'a4b', 'delegated'];
            entities.forEach(ent => {
                const el = document.getElementById(`entity-${ent}`);
                if (!el) return;

                const avatar = el.querySelector('div');
                const text = el.querySelector('span');

                if (ent === activeEntity) {
                    el.className = "flex items-center gap-2 bg-black text-white px-3 py-1.5 rounded-full shrink-0 shadow-sm cursor-pointer border border-black transition-all";
                    if (avatar) avatar.className = "w-5 h-5 rounded-full bg-white text-black text-[9px] font-black flex items-center justify-center shrink-0";
                    if (text) text.className = "text-[9px] font-bold tracking-wider leading-none";
                } else {
                    el.className = "flex items-center gap-2 bg-white text-gray-500 border border-gray-200 px-3 py-1.5 rounded-full shrink-0 shadow-sm cursor-pointer hover:bg-gray-50 transition-all";
                    if (avatar) avatar.className = "w-5 h-5 rounded-full bg-gray-100 text-gray-700 text-[9px] font-black flex items-center justify-center shrink-0";
                    if (text) text.className = "text-[9px] font-bold tracking-wider leading-none";
                }
            });

        }

        function navigateToSignRequest() {
            if (activeEntity === 'delegated') {
                window.location.href = 'casID-sign-delegated.html';
            } else {
                window.location.href = 'casID-sign-request.html';
            }
        }

        function navigateToCa() {
            if (activeEntity === 'delegated') {
                window.location.href = 'casID-sign-ca-delegated.html';
            } else {
                window.location.href = 'casID-sign-ca.html';
            }
        }

        function updateFooterNotiBadge() {
            const badge = document.getElementById('footer-noti-badge');
            if (badge) {
                const signedStatus = localStorage.getItem('doc_signed_status');
                let count = 2;
                if (signedStatus === 'signed') {
                    count = 1;
                }
                badge.textContent = count;
                badge.classList.remove('hidden');
            }
        }

        function showComingSoon() {
            showToast('Tính năng đang được phát triển');
        }

        let toastTimeout = null;
        function showToast(msg, iconClass = "fa-solid fa-circle-info text-amber-400") {
            const toast = document.getElementById('custom-toast');
            const toastMsg = document.getElementById('custom-toast-msg');
            const toastIcon = document.getElementById('custom-toast-icon');

            if (toast && toastMsg) {
                toastMsg.textContent = msg;
                if (toastIcon) toastIcon.className = iconClass;

                toast.classList.remove('hidden');
                toast.offsetHeight; // force reflow
                toast.classList.remove('-translate-y-6', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');

                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('-translate-y-6', 'opacity-0');
                    setTimeout(() => toast.classList.add('hidden'), 300);
                }, 3000);
            }
        }
    </script>
</body>

</html>
