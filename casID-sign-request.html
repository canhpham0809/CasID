<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu ký số</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, input, select, textarea, button, span, p, div, h1, h2, h3, h4, h5, h6, strong, label, input::placeholder, textarea::placeholder {
            font-family: 'Roboto', sans-serif !important;
        }

        /* Giả lập khung viền điện thoại */
        .phone-container {
            width: 375px;
            height: 812px;
        }

        /* Ẩn thanh cuộn cho thẻ đối tượng */
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Ẩn thanh cuộn của trình duyệt */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <div
        class="phone-container bg-white shadow-2xl rounded-[40px] overflow-hidden flex flex-col relative border-[8px] border-black">

        <!-- Status Bar -->
        <div class="flex justify-between items-center px-6 pt-3 pb-2 text-xs font-bold text-black bg-white z-10">
            <span>9:41</span>
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- Header -->
        <div class="px-4 py-3 flex items-center gap-4 bg-white border-b border-gray-50">
            <button class="text-gray-700 text-lg hover:opacity-70" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="text-[17px] font-bold text-gray-800">Yêu cầu ký số</h1>
        </div>

        <!-- Entity Cards Container -->
        <div class="px-4 pt-3 pb-3 bg-white border-b border-gray-50 flex gap-2 overflow-x-auto scrollbar-none"
            style="scrollbar-width: none; -ms-overflow-style: none;">
            <!-- Personal Profile -->
            <div id="entity-personal" onclick="switchEntity('personal')"
                class="flex items-center gap-2 bg-black text-white px-3 py-1 rounded-full shrink-0 shadow-sm cursor-pointer border border-black transition-all">
                <div
                    class="w-5 h-5 rounded-full bg-white text-black text-[9px] font-black flex items-center justify-center shrink-0">
                    PC
                </div>
                <span class="text-[9px] font-bold tracking-wider leading-none">PHAM HOANG QUANG CANH</span>
            </div>

            <!-- Enterprise 1 (Casso) -->
            <div id="entity-casso" onclick="switchEntity('casso')"
                class="flex items-center gap-2 bg-white text-gray-500 border border-gray-200 px-3 py-1 rounded-full shrink-0 shadow-sm cursor-pointer hover:bg-gray-50 transition-all">
                <div
                    class="w-5 h-5 rounded-full bg-gray-100 text-gray-700 text-[9px] font-black flex items-center justify-center shrink-0">
                    CS
                </div>
                <span class="text-[9px] font-bold tracking-wider leading-none">CÔNG TY TNHH CASSO</span>
            </div>

            <!-- Enterprise 2 (A4B) -->
            <div id="entity-a4b" onclick="switchEntity('a4b')"
                class="flex items-center gap-2 bg-white text-gray-500 border border-gray-200 px-3 py-1 rounded-full shrink-0 shadow-sm cursor-pointer hover:bg-gray-50 transition-all">
                <div
                    class="w-5 h-5 rounded-full bg-gray-100 text-gray-700 text-[9px] font-black flex items-center justify-center shrink-0">
                    AB
                </div>
                <span class="text-[9px] font-bold tracking-wider leading-none">CÔNG TY CỔ PHẦN A4B</span>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="px-4 pt-3 bg-white shrink-0">
            <div class="flex border-b border-gray-100 text-[12px] font-semibold text-gray-500">
                <button id="tab-all" onclick="switchTab('all')"
                    class="flex-1 pb-2.5 text-center border-b-2 border-emerald-600 text-emerald-600 font-bold transition-all">
                    Tất cả (<span id="count-all">4</span>)
                </button>
                <button id="tab-pending" onclick="switchTab('pending')"
                    class="flex-1 pb-2.5 text-center border-b-2 border-transparent transition-all">
                    Chờ ký (<span id="count-pending">2</span>)
                </button>
                <button id="tab-completed" onclick="switchTab('completed')"
                    class="flex-1 pb-2.5 text-center border-b-2 border-transparent transition-all">
                    Đã ký (<span id="count-completed">1</span>)
                </button>
                <button id="tab-rejected" onclick="switchTab('rejected')"
                    class="flex-1 pb-2.5 text-center border-b-2 border-transparent transition-all">
                    Từ chối (<span id="count-rejected">1</span>)
                </button>
            </div>
        </div>

        <!-- Request list container -->
        <div id="request-list" class="flex-1 overflow-y-auto bg-gray-50 p-4 flex flex-col gap-3">
            <!-- Cards will be dynamically injected and sorted here -->
        </div>

        <!-- Bottom Navigation Bar -->
        <div
            class="bg-white border-t border-gray-100 px-2 py-2 flex justify-around items-center text-[10px] text-gray-400 font-medium pb-5">
            <button onclick="showComingSoon()" class="flex flex-col items-center gap-1 w-16 text-gray-400">
                <i class="fa-solid fa-house text-lg"></i>
                <span>Trang chủ</span>
            </button>
            <button onclick="window.location.href='index.html'"
                class="flex flex-col items-center gap-1 w-16 text-black">
                <i class="fa-solid fa-server text-lg"></i>
                <span>Dữ liệu</span>
            </button>
            <button onclick="window.location.href='casID-sign-delegation.html'"
                class="flex flex-col items-center gap-1 w-16 text-gray-400">
                <i class="fa-solid fa-qrcode text-lg"></i>
                <span>Cấp quyền</span>
            </button>
            <button onclick="window.location.href='casID-sign-noti.html'"
                class="flex flex-col items-center gap-1 w-16 text-gray-400 relative">
                <div class="relative">
                    <i class="fa-solid fa-bell text-lg"></i>
                    <span id="footer-noti-badge"
                        class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 text-white text-[8px] font-bold rounded-full flex items-center justify-center border border-white hidden">
                        2
                    </span>
                </div>
                <span>Thông báo</span>
            </button>
            <button onclick="showComingSoon()" class="flex flex-col items-center gap-1 w-16 text-gray-400">
                <i class="fa-solid fa-circle-user text-lg"></i>
                <span class="font-bold">Hồ sơ</span>
            </button>
        <!-- Custom Toast notification wrapper -->
        <div id="custom-toast"
            class="absolute top-[75px] z-50 bg-gray-800 text-white rounded-2xl p-3 shadow-lg flex items-center gap-2 transform translate-y-[-20px] opacity-0 transition-all duration-300 pointer-events-none hidden">
            <i id="custom-toast-icon" class="fa-solid fa-circle-info text-emerald-400"></i>
            <span id="custom-toast-msg" class="text-[11px] font-semibold">Đã reset trạng thái chữ ký số!</span>
        </div>
    </div>

    <script>
        // Mock data representing the signature requests
        // Status keys: 'pending' (Chờ ký), 'completed' (Đã ký), 'rejected' (Từ chối)
        // Order: Pending first (by time desc), then completed/rejected (by time desc)
        let requestsData = [
            {
                id: 1,
                title: "Biên bản đối soát CMC CS - CASSO EKYC",
                sender: "canhphq@cas.so",
                time: "09/07/2026 15:02",
                timestamp: new Date().getTime(), // Most recent
                status: "pending",
                fileSize: "188 KB",
                entity: "casso"
            },
            {
                id: 2,
                title: "Hợp đồng dịch vụ Casso ID 2026",
                sender: "tuyetlp@cas.so",
                time: "09/07/2026 09:12",
                timestamp: new Date().getTime() - 10 * 60 * 60 * 1000,
                status: "pending",
                fileSize: "1.2 MB",
                entity: "personal"
            },
            {
                id: 3,
                title: "Biên bản bàn giao thiết bị phòng họp",
                sender: "duongdt@cas.so",
                time: "09/07/2026 17:30",
                timestamp: new Date().getTime() - 24 * 60 * 60 * 1000,
                status: "completed",
                fileSize: "450 KB",
                entity: "personal"
            },
            {
                id: 4,
                title: "Yêu cầu thanh lý hợp đồng VNPT",
                sender: "vietnh@cas.so",
                time: "08/07/2026 12:12",
                timestamp: new Date().getTime() - 2 * 24 * 60 * 60 * 1000,
                status: "rejected",
                fileSize: "320 KB",
                entity: "a4b"
            },
            {
                id: 5,
                title: "Hợp đồng lao động - Nguyễn Văn Hùng",
                sender: "hr@casso.vn",
                time: "07/07/2026 10:15",
                timestamp: new Date().getTime() - 3 * 24 * 60 * 60 * 1000,
                status: "completed",
                fileSize: "950 KB",
                entity: "casso"
            },
            {
                id: 6,
                title: "Báo cáo tài chính quý 2 A4B",
                sender: "finance@a4b.vn",
                time: "09/07/2026 16:30",
                timestamp: new Date().getTime() - 5 * 60 * 60 * 1000,
                status: "pending",
                fileSize: "2.1 MB",
                entity: "a4b"
            }
        ];

        let currentActiveTab = "all";
        let activeEntity = localStorage.getItem('active_entity') || 'personal';

        window.onload = function () {
            updateFooterNotiBadge();
            // Check dynamic signature state
            const signedStatus = localStorage.getItem('doc_signed_status');
            if (signedStatus === 'signed') {
                // Document 1 has been signed
                requestsData[0].status = 'completed';
                requestsData[0].time = "08/07/2025 15:54";
                requestsData[0].timestamp = new Date().getTime(); // Bring to top of completed section
            } else if (signedStatus === 'rejected') {
                // Document 1 has been rejected
                requestsData[0].status = 'rejected';
                requestsData[0].time = "08/07/2025 15:54";
                requestsData[0].timestamp = new Date().getTime(); // Sort to top of completed/rejected list
            }

            updateEntityUI();
            renderRequests();
        };

        function switchEntity(entityId) {
            activeEntity = entityId;
            localStorage.setItem('active_entity', entityId);
            updateEntityUI();
            renderRequests();
        }

        function updateEntityUI() {
            const entities = ['personal', 'casso', 'a4b'];
            entities.forEach(ent => {
                const el = document.getElementById(`entity-${ent}`);
                if (!el) return;

                const avatar = el.querySelector('div');
                const text = el.querySelector('span');

                if (ent === activeEntity) {
                    el.className = "flex items-center gap-2 bg-black text-white px-3 py-1 rounded-full shrink-0 shadow-sm cursor-pointer border border-black transition-all";
                    if (avatar) avatar.className = "w-5 h-5 rounded-full bg-white text-black text-[9px] font-black flex items-center justify-center shrink-0";
                    if (text) text.className = "text-[9px] font-bold tracking-wider leading-none";
                } else {
                    el.className = "flex items-center gap-2 bg-white text-gray-500 border border-gray-200 px-3 py-1 rounded-full shrink-0 shadow-sm cursor-pointer hover:bg-gray-50 transition-all";
                    if (avatar) avatar.className = "w-5 h-5 rounded-full bg-gray-100 text-gray-700 text-[9px] font-black flex items-center justify-center shrink-0";
                    if (text) text.className = "text-[9px] font-bold tracking-wider leading-none";
                }
            });
        }

        function renderRequests() {
            // Filter by active entity
            const entityData = requestsData.filter(item => item.entity === activeEntity);

            // Sort data: Pending first, sorted by timestamp descending
            // Completed and Rejected next, sorted by timestamp descending
            const sortedData = [...entityData].sort((a, b) => {
                if (a.status === 'pending' && b.status !== 'pending') return -1;
                if (a.status !== 'pending' && b.status === 'pending') return 1;
                return b.timestamp - a.timestamp;
            });

            // Filter data according to active tab
            const filteredData = sortedData.filter(item => {
                if (currentActiveTab === "all") return true;
                return item.status === currentActiveTab;
            });

            // Update badge counters
            const countAll = entityData.length;
            const countPending = entityData.filter(i => i.status === 'pending').length;
            const countCompleted = entityData.filter(i => i.status === 'completed').length;
            const countRejected = entityData.filter(i => i.status === 'rejected').length;

            const countAllEl = document.getElementById('count-all');
            const countPendingEl = document.getElementById('count-pending');
            const countCompletedEl = document.getElementById('count-completed');
            const countRejectedEl = document.getElementById('count-rejected');

            if (countAllEl) countAllEl.textContent = countAll;
            if (countPendingEl) countPendingEl.textContent = countPending;
            if (countCompletedEl) countCompletedEl.textContent = countCompleted;
            if (countRejectedEl) countRejectedEl.textContent = countRejected;

            // Render list HTML
            const container = document.getElementById('request-list');
            container.innerHTML = '';

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center text-center text-gray-400 gap-2 mt-20">
                        <i class="fa-solid fa-folder-open text-3xl text-gray-300"></i>
                        <p class="text-xs">Không tìm thấy yêu cầu nào</p>
                    </div>
                `;
                return;
            }

            filteredData.forEach(item => {
                let statusBadge = "";
                let targetUrl = "casID-sign-view.html";

                if (item.status === 'pending') {
                    statusBadge = `<span class="bg-amber-50 text-amber-700 text-[9px] font-bold px-2 py-0.5 rounded-full border border-amber-200/50">Chờ ký</span>`;
                    // Pending requests open unsigned document
                    targetUrl = "casID-sign-view.html";
                } else if (item.status === 'completed') {
                    statusBadge = `<span class="bg-emerald-50 text-emerald-700 text-[9px] font-bold px-2 py-0.5 rounded-full border border-emerald-200/50">Đã ký xong</span>`;
                    // Completed requests open PDF in signed locked state
                    targetUrl = "casID-sign-view.html?completed=true";
                } else {
                    statusBadge = `<span class="bg-red-50 text-red-700 text-[9px] font-bold px-2 py-0.5 rounded-full border border-red-200/50">Đã từ chối</span>`;
                    // Redirect to rejected state PDF view
                    targetUrl = "casID-sign-view.html?rejected=true";
                }

                const card = document.createElement('a');
                card.href = targetUrl;
                card.className = "bg-white rounded-xl p-3 shadow-sm border border-gray-100 flex flex-col gap-1.5 hover:shadow-md hover:border-gray-200 transition-all cursor-pointer active:scale-[0.99] block";
                card.innerHTML = `
                    <div class="flex justify-between items-center gap-3">
                        <h3 class="text-[11.5px] font-bold text-gray-800 leading-snug truncate flex-1">${item.title}</h3>
                        <div class="shrink-0">${statusBadge}</div>
                    </div>
                    
                    <div class="flex justify-between items-center text-[9px] text-gray-400">
                        <div class="flex items-center gap-1 font-medium">
                            <span>${item.time}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Append "Đã tải hết trang" at the end of the list
            const endText = document.createElement('div');
            endText.className = "text-center text-[10px] text-gray-400 py-3.5 font-medium shrink-0";
            endText.innerHTML = `Đã tải hết trang`;
            container.appendChild(endText);
        }

        function switchTab(tabId) {
            // Remove active classes from old tab
            const prevTab = document.getElementById(`tab-${currentActiveTab}`);
            if (prevTab) {
                prevTab.className = "flex-1 pb-2.5 text-center border-b-2 border-transparent text-gray-500 transition-all";
            }

            // Set new active tab
            currentActiveTab = tabId;
            const newTab = document.getElementById(`tab-${tabId}`);
            if (newTab) {
                newTab.className = "flex-1 pb-2.5 text-center border-b-2 border-emerald-600 text-emerald-600 font-bold transition-all";
            }

            renderRequests();
        }

        function updateFooterNotiBadge() {
            const badge = document.getElementById('footer-noti-badge');
            if (badge) {
                const signedStatus = localStorage.getItem('doc_signed_status');
                let count = 2;
                if (signedStatus === 'signed') {
                    count = 1;
                }
                badge.textContent = count;
                badge.classList.remove('hidden');
            }
        }

        function resetDemoStatus() {
            localStorage.removeItem('doc_signed_status');
            requestsData[0].status = 'pending';
            requestsData[0].time = "10/07/2026 09:42";

            showResetToast();
            renderRequests();
        }

        function showResetToast() {
            showCustomToast("Đã reset trạng thái chữ ký số!");
        }

        // Generic custom toast helper
        let toastTimeout = null;
        function showCustomToast(msg, iconClass = "fa-solid fa-circle-info text-emerald-400") {
            const toast = document.getElementById('custom-toast');
            const toastMsg = document.getElementById('custom-toast-msg');
            const toastIcon = document.getElementById('custom-toast-icon');
            if (toast && toastMsg) {
                toastMsg.textContent = msg;
                if (toastIcon) toastIcon.className = iconClass;

                toast.classList.remove('hidden');
                // Force reflow
                toast.offsetHeight;
                toast.classList.remove('translate-y-[-20px]', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');

                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-[-20px]', 'opacity-0');
                    setTimeout(() => toast.classList.add('hidden'), 300);
                }, 2500);
            }
        }

        function showComingSoon() {
            showCustomToast('Tính năng đang được phát triển');
        }
    </script>
</body>

</html>
